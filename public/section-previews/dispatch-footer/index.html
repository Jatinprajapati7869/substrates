<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dispatch Footer</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f4f2ee;
        color: #1c1b19;
        padding: 64px 24px;
      }
      .w {
        max-width: 1100px;
        margin: 0 auto;
      }
      h2 {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 500;
        letter-spacing: -0.02em;
        text-align: center;
      }
      p.s {
        text-align: center;
        color: #77736c;
        margin: 12px 0 40px;
      }
      .card {
        background: #fff;
        border: 1px solid #e6e2db;
        border-radius: 18px;
        padding: 28px;
        transition: 0.25s;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -20px #0003;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
      }
      body {
        padding: 0;
        background: #f4f2ee;
      }
      footer {
        background: #1c1b19;
        color: #f4f2ee;
        padding: 72px 24px 32px;
        min-height: 100vh;
      }
      h2 {
        text-align: center;
      }
      form {
        display: flex;
        gap: 8px;
        max-width: 440px;
        margin: 28px auto 0;
        background: #2a2926;
        border-radius: 999px;
        padding: 6px;
      }
      input {
        flex: 1;
        background: none;
        border: 0;
        color: #fff;
        padding: 0 16px;
        font: inherit;
        outline: 0;
      }
      form button {
        background: #f4f2ee;
        color: #1c1b19;
      }
      #msg {
        text-align: center;
        margin-top: 12px;
        color: #a9a49b;
        min-height: 20px;
      }
      .cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 24px;
        border-top: 1px solid #333;
        margin-top: 56px;
        padding-top: 40px;
      }
      .cols b {
        display: block;
        margin-bottom: 12px;
      }
      .cols a {
        display: block;
        color: #a9a49b;
        text-decoration: none;
        line-height: 2;
      }
      .cols a:hover {
        color: #fff;
      }
      .c {
        text-align: center;
        color: #77736c;
        margin-top: 48px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="w"></div>
    <footer>
      <div class="w">
        <h2>The Dispatch</h2>
        <p class="s" style="color: #a9a49b">One thoughtful email a month. No noise.</p>
        <form id="f">
          <input type="email" required placeholder="you@studio.com" /><button>Subscribe →</button>
        </form>
        <div id="msg"></div>
        <div class="cols">
          <div>
            <b>Product</b><a href="#">Templates</a><a href="#">Sections</a><a href="#">Pricing</a>
          </div>
          <div>
            <b>Company</b><a href="#">About</a><a href="#">Journal</a><a href="#">Careers</a>
          </div>
          <div>
            <b>Support</b><a href="#">Help</a><a href="#">Contact</a><a href="#">Licenses</a>
          </div>
          <div><b>Social</b><a href="#">X</a><a href="#">Instagram</a><a href="#">Dribbble</a></div>
        </div>
        <p class="c">© 2026 Studio. All rights reserved.</p>
      </div>
    </footer>
    <div></div>
    <script>
      f.onsubmit = (e) => {
        e.preventDefault();
        msg.textContent = "Thanks — check your inbox to confirm.";
        f.reset();
      };
    </script>
  </body>
</html>
