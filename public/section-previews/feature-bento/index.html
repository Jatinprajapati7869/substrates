<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feature Bento</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f4f2ee;
        color: #1c1b19;
        padding: 64px 24px;
      }
      .w {
        max-width: 1100px;
        margin: 0 auto;
      }
      h2 {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 500;
        letter-spacing: -0.02em;
        text-align: center;
      }
      p.s {
        text-align: center;
        color: #77736c;
        margin: 12px 0 40px;
      }
      .card {
        background: #fff;
        border: 1px solid #e6e2db;
        border-radius: 18px;
        padding: 28px;
        transition: 0.25s;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -20px #0003;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
      }
      .b {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 180px;
      }
      .card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .w2 {
        grid-column: span 2;
      }
      .h2 {
        grid-row: span 2;
      }
      .big {
        font-size: 56px;
        font-weight: 500;
      }
      .acc {
        background: #c76a3a;
        color: #fff;
        border: 0;
      }
      .bar {
        display: flex;
        gap: 6px;
        align-items: end;
        height: 80px;
      }
      .bar i {
        flex: 1;
        background: #e6d5c4;
        border-radius: 6px;
        transition: 0.4s;
      }
      .card:hover .bar i {
        background: #c76a3a;
      }
      @media (max-width: 700px) {
        .b {
          grid-template-columns: 1fr 1fr;
        }
        .w2 {
          grid-column: span 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="w">
      <h2>Everything, in one place</h2>
      <p class="s">Hover the tiles.</p>
      <div class="b">
        <div class="card w2 h2 acc">
          <b>Fast by default</b>
          <div class="big" id="c">0ms</div>
          <span>Edge-rendered pages load before you blink.</span>
        </div>
        <div class="card"><b>Secure</b><span>Encrypted at rest and in transit.</span></div>
        <div class="card"><b>Global</b><span>300+ locations.</span></div>
        <div class="card w2">
          <b>Growth</b>
          <div class="bar">
            <i style="height: 30%"></i><i style="height: 45%"></i><i style="height: 40%"></i
            ><i style="height: 65%"></i><i style="height: 80%"></i><i style="height: 100%"></i>
          </div>
        </div>
        <div class="card w2">
          <b>Integrations</b><span>Connect the tools you already use, in a click.</span>
        </div>
        <div class="card w2"><b>Teams</b><span>Roles, comments and shared libraries.</span></div>
      </div>
    </div>
    <script>
      let v = 0;
      const c = document.getElementById("c");
      const t = setInterval(() => {
        v += 3;
        c.textContent = v + "ms";
        if (v >= 42) clearInterval(t);
      }, 40);
    </script>
  </body>
</html>
