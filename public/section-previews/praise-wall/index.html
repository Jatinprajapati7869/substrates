<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Praise Wall</title><style>
*{box-sizing:border-box;margin:0}body{font-family:ui-sans-serif,system-ui,sans-serif;background:#f4f2ee;color:#1c1b19;padding:64px 24px}
.w{max-width:1100px;margin:0 auto}h2{font-size:clamp(28px,4vw,44px);font-weight:500;letter-spacing:-.02em;text-align:center}p.s{text-align:center;color:#77736c;margin:12px 0 40px}
.card{background:#fff;border:1px solid #e6e2db;border-radius:18px;padding:28px;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px #0003}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 20px}
.m{columns:3 260px;gap:16px}.card{break-inside:avoid;margin-bottom:16px}.a{display:flex;gap:12px;align-items:center;margin-top:18px}.a i{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#d9c9b3,#8a7b68)}small{color:#77736c;display:block}.st{color:#c9973a;letter-spacing:2px}button{display:block;margin:24px auto 0;background:#1c1b19;color:#fff}</style></head><body><div class="w"><h2>Loved by makers</h2><p class="s">Real words from people shipping with us.</p><div class="m" id="m"></div><button id="more">Show more</button></div><script>const q=[["Ana Ruiz","Designer","Shipped our site in a weekend. Clients noticed immediately."],["Theo Park","Founder","The cleanest starting point I've used. Zero fighting the layout."],["Mia Chen","Studio lead","We reuse it on every pitch now."],["Sam Ade","Developer","Readable code, sensible structure, great defaults."],["Lea Moss","Writer","Finally a site that feels like me."],["Ivo Berg","PM","Our conversion rate went up the week we launched."],["Nora Lind","Photographer","Images look stunning, it gets out of the way."],["Jay Kim","Marketer","Every section just works on mobile."],["Rae Vos","Agency owner","Saves us days per project."]];let n=0;const m=document.getElementById('m');function add(k){q.slice(n,n+k).forEach(([a,r,t])=>{m.insertAdjacentHTML('beforeend',`<div class="card"><div class="st">★★★★★</div><p style="margin-top:10px;line-height:1.5">“${t}”</p><div class="a"><i></i><div><b>${a}</b><small>${r}</small></div></div></div>`)});n+=k;if(n>=q.length)document.getElementById('more').remove()}add(6);document.getElementById('more').onclick=()=>add(3)</script></body></html>
