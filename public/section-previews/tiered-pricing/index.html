<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiered Pricing</title><style>
*{box-sizing:border-box;margin:0}body{font-family:ui-sans-serif,system-ui,sans-serif;background:#f4f2ee;color:#1c1b19;padding:64px 24px}
.w{max-width:1100px;margin:0 auto}h2{font-size:clamp(28px,4vw,44px);font-weight:500;letter-spacing:-.02em;text-align:center}p.s{text-align:center;color:#77736c;margin:12px 0 40px}
.card{background:#fff;border:1px solid #e6e2db;border-radius:18px;padding:28px;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px #0003}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 20px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.dark{background:#1c1b19;color:#f4f2ee}.price{font-size:44px;margin:16px 0}.t{display:flex;justify-content:center;gap:4px;background:#e6e2db;border-radius:999px;padding:4px;width:max-content;margin:0 auto 32px}.t button{background:none}.t .on{background:#fff}ul{padding:0;list-style:none;margin:20px 0;line-height:2;color:inherit;opacity:.8}.card button{width:100%;background:#1c1b19;color:#fff}.dark button{background:#f4f2ee;color:#1c1b19}</style></head><body><div class="w"><h2>Simple, honest pricing</h2><p class="s">Start free. Upgrade when you grow.</p><div class="t"><button class="on" data-p="m">Monthly</button><button data-p="y">Yearly −20%</button></div><div class="g">
<div class="card"><b>Starter</b><div class="price" data-m="0" data-y="0">$0</div><ul><li>✓ 1 project</li><li>✓ Community support</li></ul><button>Get started</button></div>
<div class="card dark"><b>Studio</b><div class="price" data-m="24" data-y="19">$24</div><ul><li>✓ Unlimited projects</li><li>✓ Custom domains</li><li>✓ Priority support</li></ul><button>Choose Studio</button></div>
<div class="card"><b>Team</b><div class="price" data-m="59" data-y="47">$59</div><ul><li>✓ 10 seats</li><li>✓ Roles & SSO</li></ul><button>Talk to us</button></div></div></div><script>document.querySelectorAll('.t button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.t button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.price').forEach(p=>p.textContent='$'+p.dataset[b.dataset.p])})</script></body></html>
